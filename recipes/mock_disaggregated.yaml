# CPU-only mock path that starts the local Ray actor graph in disaggregated mode.
run:
  intent: train
  emit_resolved_config: false
  start_ray_actors: true

mock:
  enabled: true
  seed: 11
  ray_actor_memory_mb: 64

runtime:
  backend: ray
  local:
    num_gpus: 4
    cpus: 16
  storage:
    allowed_input_sources: [mock_inline, mock_generated, mock_jsonl]
  ray:
    address: auto
    namespace: nano-rl-mock
    dedup_logs: false
    gpu_manager:
      enabled: true
      lease_manager: true
      role_classes:
        rollout_manager: nano_rl.runtime.roles.RolloutManagerRole
        rollout_replica_controller: nano_rl.runtime.roles.RolloutReplicaControllerRole
        rollout_worker: nano_rl.runtime.roles.RolloutWorkerRole
        trainer_rank: nano_rl.runtime.roles.TrainerRankRole
      topology:
        rollout_only_gpus: 2
        shared_gpus: 2
        idle_gpus: 0
      hybrid_toggle:
        strategy: swap_on_toggle
        rollout_drain_timeout_sec: 5
        train_drain_timeout_sec: 5
        cuda_quiesce_timeout_sec: 5
        offload:
          trainer_model: cpu
          trainer_optimizer: cpu
          rollout_engine: teardown_and_reload
          cpu_memory_budget_gb: 1
          residual_gpu_memory_budget_mb: 0
    placement:
      trainer:
        num_ranks: 2
        gpus_per_rank: 1
        cpus_per_rank: 0
      rollout:
        num_replicas: 2
        gpus_per_replica: 2
        tensor_parallel_size: 2

mode: disaggregated

parallel:
  trainer:
    data_parallel_size: 2
    fsdp_world_size: 2
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
  rollout:
    data_parallel_size: 2
    tensor_parallel_size: 2

model:
  model_path: mock://models/tiny-policy
  tokenizer_path: mock://models/tiny-tokenizer

data:
  source_type: mock_generated
  prompt_column: prompt
  mock_generated:
    count: 8
    template: "mock prompt {index}"
    start_index: 100
    shuffle: false
  mock_profile:
    enabled: true
    sleep_enabled: true
    prompt_length_distribution: chat_mixture
    min_prompt_tokens: 24
    mean_prompt_tokens: 384
    max_prompt_tokens: 1536
    length_jitter: 0.7
    pad_prompts: true
    load_base_ms: 3
    load_ms_per_1k_tokens: 18
    load_jitter_ms: 6
    max_load_ms: 80

algorithm:
  name: ppo
  max_steps: 4
  learning_rate: 1.0e-6
  seed: 11

trainer:
  backend: mock
  global_batch_size: 4
  mock:
    initial_loss: 1.0
    loss_decay: reciprocal
    export_format: vllm_compatible
    optimizer_state: tracked
    require_rank0_export: true

rollout:
  backend: mock
  mock:
    response_template: "mock-response@v{policy_version} prompt_tokens={prompt_tokens} response_tokens={response_token_count}: {response_body}"
    max_response_tokens: 512
    min_response_tokens: 16
    mean_response_tokens: 96
    response_length_distribution: lognormal
    response_length_jitter: 0.75
    max_sequence_tokens: 4096
    prefill_base_ms: 4
    prefill_ms_per_1k_tokens: 32
    decode_base_ms: 4
    decode_ms_per_token: 2.5
    latency_jitter_ms: 20
    max_sample_sleep_ms: 1200
    include_policy_segments: true
  partial_rollout:
    enabled: true
    pause_mode: keep
    clear_cache: true
    mixed_policy_samples: train
  hybrid:
    enabled: true
    policy_pin:
      latest_ratio: 0.75
      lagged_ratio: 0.25

reward:
  backend: mock
  mock:
    name: deterministic_length_reward
    scale: 100.0
    cap: 1.0

weight_transfer:
  method: locality_aware_checkpoint
  allow_rollout_only_artifact_pull: true
  max_versions_in_flight: 2
  store:
    backend: mock_filesystem
    manifest_dir: ./.nano-rl-mock/disaggregated/weights

control:
  max_policy_lag: 2
  sample_ttl_sec: 60
  queue_high_watermark: 64
  max_pending_rollout_refs: 16
  max_pending_train_refs: 4
