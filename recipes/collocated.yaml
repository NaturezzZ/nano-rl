# Local 8-GPU real-backend training recipe wired to the checked-in asset dirs.
#
# Rollout uses vLLM with tensor_parallel_size=2. The FSDP2 trainer and rollout
# backend both load from a Transformers-compatible checkpoint directory. The
# eight shared GPUs resolve to four rollout replicas, each owning one 2-GPU TP
# group, and eight trainer ranks during the train window.
run:
  intent: train
  emit_resolved_config: false
  start_ray_actors: true

runtime:
  backend: ray
  local:
    num_gpus: 8
    cpus: 64
  storage:
    allowed_input_sources: [local_csv]
  ray:
    address: auto
    namespace: nano-rl-local
    dedup_logs: false
    gpu_manager:
      enabled: true
      lease_manager: true
      role_classes:
        rollout_manager: nano_rl.runtime.roles.RolloutManagerRole
        rollout_replica_controller: nano_rl.runtime.roles.RolloutReplicaControllerRole
        rollout_worker: nano_rl.runtime.roles.RolloutWorkerRole
        trainer_rank: nano_rl.runtime.roles.TrainerRankRole
      topology:
        rollout_only_gpus: 0
        shared_gpus: 8
        idle_gpus: 0
      hybrid_toggle:
        strategy: swap_on_toggle
        rollout_drain_timeout_sec: 5
        train_drain_timeout_sec: 5
        cuda_quiesce_timeout_sec: 5
        offload:
          trainer_model: cpu
          trainer_optimizer: cpu
          rollout_engine: vllm_sleep
          vllm_sleep_level: 2
          cpu_memory_budget_gb: 64
          residual_gpu_memory_budget_mb: 2048
    placement:
      trainer:
        num_ranks: 8
        gpus_per_rank: 1
        cpus_per_rank: 4
      rollout:
        num_replicas: 4
        gpus_per_replica: 2
        tensor_parallel_size: 2

mode: collocated

parallel:
  trainer:
    data_parallel_size: 8
    fsdp_world_size: 8
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
  rollout:
    data_parallel_size: 4
    tensor_parallel_size: 2

model:
  model_path: ./huggingface/models/qwen3-0.6b-hf
  tokenizer_path: ./huggingface/models/qwen3-0.6b-hf

data:
  source_type: local_csv
  data_path: ./huggingface/data/awesome-chatgpt-prompts/prompts.csv
  prompt_column: prompt
  local_csv:
    encoding: utf-8

algorithm:
  name: ppo
  max_steps: 3
  learning_rate: 1.0e-6
  seed: 23

trainer:
  backend: fsdp2
  global_batch_size: 8
  checkpoint_dir: ./.nano-rl-local/qwen3-awesome-prompts/fsdp-checkpoints
  fsdp2:
    mixed_precision: bf16
    sharding: full_shard
    # Single-machine v0.1 rendezvous shared by all TrainerRankActors.
    store_endpoint: 127.0.0.1:29500
    dist_backend: nccl
    trust_remote_code: true
    max_length: 2048

rollout:
  backend: vllm
  vllm:
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 2048
    weight_sync_backend: ipc
    require_weight_sync: true
    engine_kwargs:
      enable_sleep_mode: true
    sampling_params:
      temperature: 0.8
      top_p: 0.95
      max_tokens: 256
  partial_rollout:
    enabled: false
    pause_mode: keep
    clear_cache: true
    mixed_policy_samples: drop
  hybrid:
    enabled: true
    policy_pin:
      latest_ratio: 1.0
      lagged_ratio: 0.0

reward:
  backend: mock
  mock:
    name: deterministic_length_reward
    scale: 100.0
    cap: 1.0

weight_transfer:
  method: locality_aware_checkpoint
  allow_rollout_only_artifact_pull: true
  max_versions_in_flight: 2
  store:
    backend: checkpoint

control:
  max_policy_lag: 0
  sample_ttl_sec: 60
  queue_high_watermark: 64
  max_pending_rollout_refs: 8
  max_pending_train_refs: 8
