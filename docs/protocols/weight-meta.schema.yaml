$schema: "https://json-schema.org/draft/2020-12/schema"
title: WeightMeta
type: object
required: [version_id, created_at, source_type, model_uri, format, checksum]
properties:
  version_id: { type: integer, minimum: 0 }
  parent_version: { type: integer, minimum: 0 }
  trainer_step: { type: integer, minimum: 0 }
  created_at: { type: string, format: date-time }
  source_type:
    type: string
    enum: [hdfs_uri, hdfs_fuse_path]
  model_uri: { type: string, minLength: 1 }
  tokenizer_uri: { type: string, minLength: 1 }
  artifact_uri: { type: string, minLength: 1 }
  manifest_uri: { type: string, minLength: 1 }
  format:
    type: string
    enum: [hf, safetensors, vllm_compatible]
  checksum: { type: string }
  tokenizer_hash: { type: string }
  chat_template_hash: { type: string }
  created_by: { type: string }
  status:
    type: string
    enum: [registered, activating, active_global, failed, deprecated]
allOf:
  - if:
      properties:
        source_type: { const: hdfs_uri }
    then:
      properties:
        model_uri: { pattern: "^hdfs://" }
        tokenizer_uri: { pattern: "^hdfs://" }
        artifact_uri: { pattern: "^hdfs://" }
        manifest_uri: { pattern: "^hdfs://" }
  - if:
      properties:
        source_type: { const: hdfs_fuse_path }
    then:
      properties:
        model_uri: { pattern: "^/" }
        tokenizer_uri: { pattern: "^/" }
        artifact_uri: { pattern: "^/" }
        manifest_uri: { pattern: "^/" }
