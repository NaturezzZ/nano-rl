$schema: "https://json-schema.org/draft/2020-12/schema"
title: WeightMeta
type: object
required: [version_id, created_at, model_path, format, checksum]
properties:
  version_id: { type: integer, minimum: 0 }
  parent_version: { type: integer, minimum: 0 }
  trainer_step: { type: integer, minimum: 0 }
  created_at: { type: string, format: date-time }
  model_path: { type: string, minLength: 1 }
  tokenizer_path: { type: string, minLength: 1 }
  artifact_uri: { type: string, minLength: 1 }
  manifest_uri: { type: string, minLength: 1 }
  format:
    type: string
    enum: [hf, safetensors, vllm_compatible]
  checksum: { type: string }
  tokenizer_hash: { type: string }
  chat_template_hash: { type: string }
  created_by: { type: string }
  status:
    type: string
    enum: [registered, activating, active_global, failed, deprecated]
