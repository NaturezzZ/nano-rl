$schema: "https://json-schema.org/draft/2020-12/schema"
title: SampleRecord
type: object
required: [sample_id, policy_version, prompt, response, tokens, logprobs, reward]
properties:
  sample_id: { type: string }
  request_id: { type: string }
  policy_version: { type: integer, minimum: 0 }
  policy_version_max: { type: integer, minimum: 0 }
  weight_checksum: { type: string }
  prompt: { type: string }
  response: { type: string }
  finish_reason: { type: string }
  created_at: { type: string, format: date-time }
  expires_at: { type: string, format: date-time }
  prompt_tokens: { type: integer, minimum: 0 }
  response_tokens: { type: integer, minimum: 0 }
  tokens:
    type: array
    items: { type: integer }
  logprobs:
    type: array
    items: { type: number }
  old_logprobs:
    type: array
    items: { type: number }
  reward: { type: number }
  reward_source: { type: string }
  advantages:
    type: array
    items: { type: number }
  drop_reason: { type: string }
  policy_segments:
    type: array
    items:
      type: object
      required: [start_token, end_token, policy_version]
      properties:
        start_token: { type: integer, minimum: 0 }
        end_token: { type: integer, minimum: 0 }
        policy_version: { type: integer, minimum: 0 }
        weight_checksum: { type: string }
  meta:
    type: object
    additionalProperties: true
    properties:
      replica_id: { type: string }
      worker_id: { type: string }
      worker_ids:
        type: array
        items: { type: string }
      gpu_id: { type: integer, minimum: 0 }
      gpu_ids:
        type: array
        items: { type: integer, minimum: 0 }
      lease_epoch: { type: integer, minimum: 0 }
      lease_epochs:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      latency_ms: { type: integer, minimum: 0 }
      precision_tag: { type: string }
