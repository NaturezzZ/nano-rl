$schema: "https://json-schema.org/draft/2020-12/schema"
title: NanoRLRuntimeConfig
type: object
required: [run, runtime, mode, parallel, model, data, algorithm, trainer, rollout, control]
properties:
  mock:
    type: object
    description: Optional global defaults for deterministic high-level mock modules.
    properties:
      enabled: { type: boolean, default: false }
      seed: { type: integer, minimum: 0, default: 0 }
      strict:
        type: object
        properties:
          leases: { type: boolean, default: true }
          versions: { type: boolean, default: true }
          no_gpu_imports: { type: boolean, default: true }
          no_external_data_probe: { type: boolean, default: true }
      timing:
        type: object
        properties:
          rollout_sleep_ms: { type: integer, minimum: 0, default: 0 }
          trainer_sleep_ms: { type: integer, minimum: 0, default: 0 }
          weight_io_sleep_ms: { type: integer, minimum: 0, default: 0 }
      failure_injection:
        type: object
        properties:
          enabled: { type: boolean, default: false }
          fail_after_rollout_requests: { type: [integer, "null"], minimum: 1 }
          fail_on_train_step: { type: [integer, "null"], minimum: 1 }
          fail_weight_version: { type: [integer, "null"], minimum: 0 }
          corrupt_weight_checksum: { type: boolean, default: false }
          stale_lease_epoch_delta: { type: integer, minimum: 0, default: 0 }
  run:
    type: object
    required: [intent]
    description: Runtime intent and startup switches. train builds the Ray launch plan in all cases; start_ray_actors gates whether the real Ray actor graph is started.
    properties:
      intent:
        type: string
        enum: [train, dry_run, validate]
      emit_resolved_config:
        type: boolean
      start_ray_actors:
        type: boolean
        description: When false, train emits a backend-integrated launch plan without creating Ray actors. When true, RayDriver starts the Ray actor graph and actor wrappers construct vLLM/FSDP2 backend adapters lazily.
  runtime:
    type: object
    required: [backend, local, storage, ray]
    properties:
      backend:
        type: string
        enum: [ray]
      local:
        type: object
        required: [num_gpus, cpus]
        properties:
          num_gpus: { type: integer, minimum: 1 }
          cpus: { type: integer, minimum: 1 }
      storage:
        type: object
        required: [allowed_input_sources]
        properties:
          allowed_input_sources:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum: [hdfs_uri, hdfs_fuse_path, mock_inline, mock_generated, mock_jsonl]
          hdfs:
            type: object
            required: [cli]
            properties:
              cli: { type: string, minLength: 1 }
              read_probe_timeout_sec: { type: integer, minimum: 1 }
          hdfs_fuse:
            type: object
            required: [mount_root]
            properties:
              mount_root:
                type: string
                pattern: "^/"
              require_mount: { type: boolean }
              read_probe_timeout_sec: { type: integer, minimum: 1 }
      ray:
        type: object
        required: [address, namespace, gpu_manager, placement]
        properties:
          address:
            type: string
            description: Ray address. auto first tries to connect to an existing cluster; if no cluster is reachable, startup creates a single-machine local Ray cluster with the resolved node custom resources. Explicit non-auto addresses keep fail-fast connection semantics.
          namespace:
            type: string
            minLength: 1
          gpu_manager:
            type: object
            required: [enabled, lease_manager, topology, role_classes, hybrid_toggle]
            properties:
              enabled:
                type: boolean
                const: true
              lease_manager:
                type: boolean
                const: true
              role_classes:
                type: object
                required: [rollout_manager, rollout_replica_controller, rollout_worker]
                properties:
                  rollout_manager: { type: string, minLength: 1 }
                  rollout_replica_controller: { type: string, minLength: 1 }
                  rollout_worker: { type: string, minLength: 1 }
                  trainer_rank: { type: string, minLength: 1 }
              topology:
                type: object
                required: [rollout_only_gpus, shared_gpus]
                properties:
                  rollout_only_gpus: { type: integer, minimum: 0 }
                  shared_gpus: { type: integer, minimum: 0 }
                  idle_gpus: { type: integer, minimum: 0 }
              hybrid_toggle:
                type: object
                required: [strategy, rollout_drain_timeout_sec, train_drain_timeout_sec, cuda_quiesce_timeout_sec, offload]
                properties:
                  strategy:
                    type: string
                    enum: [swap_on_toggle, dual_resident]
                  rollout_drain_timeout_sec: { type: integer, minimum: 1 }
                  train_drain_timeout_sec: { type: integer, minimum: 1 }
                  cuda_quiesce_timeout_sec: { type: integer, minimum: 1 }
                  offload:
                    type: object
                    required: [trainer_model, trainer_optimizer, rollout_engine]
                    properties:
                      trainer_model:
                        type: string
                        enum: [cpu_pinned, cpu]
                      trainer_optimizer:
                        type: string
                        enum: [cpu_pinned, cpu]
                      rollout_engine:
                        type: string
                        enum: [vllm_sleep, teardown_and_reload]
                      vllm_sleep_level:
                        type: integer
                        enum: [1, 2]
                      cpu_memory_budget_gb:
                        type: number
                        minimum: 1
                      residual_gpu_memory_budget_mb:
                        type: integer
                        minimum: 0
                    allOf:
                      - if:
                          properties:
                            rollout_engine: { const: vllm_sleep }
                        then:
                          required: [vllm_sleep_level]
          placement:
            type: object
            required: [trainer, rollout]
            properties:
              trainer:
                type: object
                required: [num_ranks, gpus_per_rank]
                properties:
                  num_ranks: { type: integer, minimum: 1 }
                  gpus_per_rank: { type: number, minimum: 0 }
                  cpus_per_rank: { type: number, minimum: 0 }
              rollout:
                type: object
                required: [num_replicas, gpus_per_replica, tensor_parallel_size]
                properties:
                  num_replicas: { type: integer, minimum: 1 }
                  gpus_per_replica: { type: integer, minimum: 1 }
                  tensor_parallel_size: { type: integer, minimum: 1 }
              reward:
                type: object
                properties:
                  num_actors: { type: integer, minimum: 1 }
                  cpus_per_actor: { type: number, minimum: 0 }
  mode:
    type: string
    enum: [collocated, disaggregated]
  parallel:
    type: object
    required: [trainer, rollout]
    properties:
      trainer:
        type: object
        required: [data_parallel_size, fsdp_world_size]
        properties:
          data_parallel_size: { type: integer, minimum: 1 }
          fsdp_world_size: { type: integer, minimum: 1 }
          tensor_parallel_size: { type: integer, minimum: 1 }
          pipeline_parallel_size: { type: integer, minimum: 1 }
      rollout:
        type: object
        required: [data_parallel_size, tensor_parallel_size]
        properties:
          data_parallel_size: { type: integer, minimum: 1 }
          tensor_parallel_size: { type: integer, minimum: 1 }
  model:
    type: object
    required: [model_path]
    properties:
      model_path: { type: string, minLength: 1 }
      tokenizer_path: { type: string, minLength: 1 }
  data:
    type: object
    required: [source_type]
    properties:
      source_type:
        type: string
        enum: [hdfs_uri, hdfs_fuse_path, mock_inline, mock_generated, mock_jsonl]
      data_path: { type: string, minLength: 1 }
      prompt_column: { type: string, minLength: 1 }
      mock_inline:
        type: object
        properties:
          prompts:
            type: array
            items: { type: string }
          repeat: { type: integer, minimum: 1, default: 1 }
      mock_generated:
        type: object
        required: [count]
        properties:
          count: { type: integer, minimum: 1 }
          template: { type: string, default: "prompt-{index}" }
          start_index: { type: integer, minimum: 0, default: 0 }
          shuffle:
            anyOf:
              - type: boolean
              - type: string
                enum: ["false", deterministic]
      mock_jsonl:
        type: object
        properties:
          encoding: { type: string, default: utf-8 }
    allOf:
      - if:
          properties:
            source_type: { const: hdfs_uri }
        then:
          properties:
            data_path: { pattern: "^hdfs://" }
      - if:
          properties:
            source_type: { const: hdfs_fuse_path }
        then:
          properties:
            data_path: { pattern: "^/" }
  algorithm:
    type: object
    required: [name, max_steps, learning_rate]
    properties:
      name:
        type: string
        enum: [ppo]
      max_steps: { type: integer, minimum: 1 }
      learning_rate: { type: number, exclusiveMinimum: 0 }
      seed: { type: integer, minimum: 0 }
  trainer:
    type: object
    required: [backend, global_batch_size]
    description: Trainer runtime configuration. Real FSDP2 weight export needs a checkpoint_dir and multi-rank execution also needs process-group rendezvous metadata from the actor runtime.
    properties:
      backend:
        type: string
        enum: [fsdp2, mock, fake]
      global_batch_size:
        type: integer
        minimum: 1
      checkpoint_dir:
        type: string
        minLength: 1
        description: Directory used by the rank-0 FSDP2 backend to write versioned checkpoints that rollout/vLLM can reload.
      fsdp2:
        type: object
        required: [mixed_precision, sharding]
        properties:
          mixed_precision:
            type: string
            enum: [bf16, fp16]
          sharding:
            type: string
            enum: [full_shard, hybrid_shard]
      mock:
        type: object
        properties:
          initial_loss: { type: number, exclusiveMinimum: 0, default: 1.0 }
          loss_decay: { type: string, enum: [reciprocal, constant], default: reciprocal }
          export_format: { type: string, enum: [vllm_compatible, hf, safetensors], default: vllm_compatible }
          optimizer_state: { type: string, enum: [tracked, stateless], default: tracked }
          require_rank0_export: { type: boolean, default: true }
          seed: { type: integer, minimum: 0, default: 0 }
          num_parameters: { type: integer, minimum: 0, default: 1024 }
  rollout:
    type: object
    required: [backend]
    properties:
      backend:
        type: string
        enum: [vllm, mock]
      vllm:
        type: object
        properties:
          dtype: { type: [string, "null"] }
          max_model_len: { type: [integer, "null"], minimum: 1 }
          trust_remote_code: { type: boolean, default: false }
          engine_kwargs: { type: object }
          sampling_params: { type: object }
      mock:
        type: object
        properties:
          response_template: { type: string, default: "{prompt} :: response@v{policy_version}" }
          tokenization: { type: string, enum: [sha256_bytes, whitespace_hash], default: sha256_bytes }
          max_response_tokens: { type: integer, minimum: 1, default: 16 }
          logprob_mode: { type: string, enum: [linear, constant], default: linear }
          finish_reason: { type: string, default: stop }
          include_policy_segments: { type: boolean, default: false }
          seed: { type: integer, minimum: 0, default: 0 }
      partial_rollout:
        type: object
        required: [enabled, pause_mode, clear_cache, mixed_policy_samples]
        properties:
          enabled: { type: boolean }
          pause_mode:
            type: string
            enum: [keep]
          clear_cache:
            type: boolean
            const: true
          mixed_policy_samples:
            type: string
            enum: [train, drop]
      hybrid:
        type: object
        properties:
          enabled:
            type: boolean
          precision_mix:
            type: object
            properties:
              bf16: { type: number, minimum: 0, maximum: 1 }
              fp8: { type: number, minimum: 0, maximum: 1 }
          policy_pin:
            type: object
            properties:
              latest_ratio: { type: number, minimum: 0, maximum: 1 }
              lagged_ratio: { type: number, minimum: 0, maximum: 1 }
  weight_transfer:
    type: object
    description: >
      Independent trainer-to-rollout weight transfer policy. objectref
      materializes weights through Ray object store refs.
      locality_aware_checkpoint keeps large tensors out of Ray object store:
      shared rollout GPUs reshard local FSDP2 state, and rollout-only GPUs
      hydrate from artifact or manifest paths.
    properties:
      method:
        type: string
        enum: [objectref, locality_aware_checkpoint]
        default: locality_aware_checkpoint
      allow_rollout_only_artifact_pull:
        type: boolean
        default: true
        description: Required for locality_aware_checkpoint when rollout_only_gpus are present, because those GPUs do not own trainer-resident FSDP2 shards.
      max_versions_in_flight:
        type: integer
        minimum: 1
        default: 2
      store:
        type: object
        properties:
          backend:
            type: string
            enum: [checkpoint, mock_memory, mock_filesystem]
            default: checkpoint
          manifest_dir:
            type: [string, "null"]
          checksum_mode:
            type: string
            enum: [semantic_sha256]
            default: semantic_sha256
  reward:
    type: object
    properties:
      backend:
        type: string
        enum: [mock]
        default: mock
      mock:
        type: object
        properties:
          name: { type: string, default: deterministic_length_reward }
          scale: { type: number, exclusiveMinimum: 0, default: 100.0 }
          cap: { type: number, exclusiveMinimum: 0, default: 1.0 }
  control:
    type: object
    required: [max_policy_lag, sample_ttl_sec, queue_high_watermark, max_pending_rollout_refs, max_pending_train_refs]
    properties:
      max_policy_lag: { type: integer, minimum: 0 }
      sample_ttl_sec: { type: integer, minimum: 1 }
      queue_high_watermark: { type: integer, minimum: 1 }
      max_pending_rollout_refs: { type: integer, minimum: 1 }
      max_pending_train_refs: { type: integer, minimum: 1 }
